name: Build and release

# Every push to main: build the exe and keep it as a workflow artifact (to test the build).
# Every tag like v0.1.0: build the exe and publish it on the Releases page, with a SHA256 file.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      # Same script as on a normal PC: it uses the C# compiler that is already in Windows.
      - name: Build ff14-key2key.exe
        shell: cmd
        run: csharp\build.bat nopause

      - name: Make the SHA256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 csharp\ff14-key2key.exe).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD\csharp\ff14-key2key.exe.sha256", "$hash *ff14-key2key.exe`n")
          Get-Content csharp\ff14-key2key.exe.sha256

      - name: Keep the build as an artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ff14-key2key
          path: |
            csharp/ff14-key2key.exe
            csharp/ff14-key2key.exe.sha256

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Built by GitHub Actions from the source code of this tag. The build log is public.
          The file has no digital signature, so Windows may show a warning. The program asks for administrator rights.
          To check the file, compare the SHA256 of ff14-key2key.exe with the number in ff14-key2key.exe.sha256:
          certutil -hashfile ff14-key2key.exe SHA256

          由 GitHub Actions 以此標籤的原始碼自動編譯，編譯紀錄公開。
          檔案沒有數位簽章，Windows 可能顯示警告；程式會要求系統管理員權限。
          檢查方式：用 certutil -hashfile ff14-key2key.exe SHA256 算出的值，和 ff14-key2key.exe.sha256 裡的數字比對。
          EOF
          gh release create "$TAG" csharp/ff14-key2key.exe csharp/ff14-key2key.exe.sha256 --title "$TAG" --notes-file release-notes.md
