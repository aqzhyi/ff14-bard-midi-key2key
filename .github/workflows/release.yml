name: Build and release

# Every push to main: build the exe and keep it as a workflow artifact (to test the build).
# Every tag like v0.1.0: build the exe and publish it on the Releases page, with a SHA256 file.
# Manual run (Actions tab, "Run workflow"): type a version like v0.1.0 to build, create that tag and publish the release.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, for example v0.1.0. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      # Same script as on a normal PC: it uses the C# compiler that is already in Windows.
      - name: Build ff14-key2key.exe and ff14-key2key-gui.exe
        shell: cmd
        run: csharp\build.bat nopause

      - name: Make the SHA256 files
        shell: pwsh
        run: |
          foreach ($name in @("ff14-key2key.exe", "ff14-key2key-gui.exe")) {
            $hash = (Get-FileHash -Algorithm SHA256 "csharp\$name").Hash.ToLower()
            [System.IO.File]::WriteAllText("$PWD\csharp\$name.sha256", "$hash *$name`n")
            Get-Content "csharp\$name.sha256"
          }

      - name: Keep the build as an artifact
        if: github.ref_type != 'tag' && inputs.version == ''
        uses: actions/upload-artifact@v4
        with:
          name: ff14-key2key
          path: |
            csharp/ff14-key2key.exe
            csharp/ff14-key2key.exe.sha256
            csharp/ff14-key2key-gui.exe
            csharp/ff14-key2key-gui.exe.sha256

      - name: Publish the release
        if: github.ref_type == 'tag' || inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "The version must start with v, for example v0.1.0"; exit 1 ;;
          esac
          cat > release-notes.md <<'EOF'
          Built by GitHub Actions from the source code of this tag. The build log is public.
          ff14-key2key-gui.exe is the window version (buttons, pause/resume, system tray). ff14-key2key.exe is the console version.
          The files have no digital signature, so Windows may show a warning. The programs ask for administrator rights.
          To check a file, compare its SHA256 with the number in the matching .sha256 file, for example:
          certutil -hashfile ff14-key2key-gui.exe SHA256

          由 GitHub Actions 以此標籤的原始碼自動編譯，編譯紀錄公開。
          ff14-key2key-gui.exe 是視窗版（按鈕操作、暫停／繼續、系統匣背景執行）；ff14-key2key.exe 是主控台版。
          檔案沒有數位簽章，Windows 可能顯示警告；程式會要求系統管理員權限。
          檢查方式：用 certutil -hashfile ff14-key2key-gui.exe SHA256 算出的值，和對應的 .sha256 檔裡的數字比對。
          EOF
          gh release create "$TAG" csharp/ff14-key2key-gui.exe csharp/ff14-key2key-gui.exe.sha256 csharp/ff14-key2key.exe csharp/ff14-key2key.exe.sha256 --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
